name: PR Check

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # 名称会作为 main 分支规则集的必需检查，修改时同步更新仓库规则集
    name: Lint / Test / Debug Build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # pull_request 默认检出 refs/pull/N/merge（GitHub 合成的 merge 提交），git diff-tree 对它
          # 默认不输出差异，会让「本轮改动面」判定失真（2026-11-15 三审 B1）。显式检出 PR head
          # 真实 commit，让 HEAD 就是本轮最后一个功能提交；BASE 仍用 base.sha。
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # PR base 可能比 depth=2 更远，取全量保证 BASE=base.sha 可解析（闸对不可解析 fail-closed）。
          fetch-depth: 0
          persist-credentials: false

      # 未修项硬闸：本次改动新增 TODO/FIXME/@Ignore/@Disabled 即拦下（铁律 2）。
      - name: 未修项闸
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          if [ -n "$BASE_SHA" ]; then export BASE="$BASE_SHA"; else export BASE="HEAD^"; fi
          sh scripts/check-unfixed.sh

      - name: 配置构建环境
        uses: ./.github/actions/setup-build

      # PR 来自 fork 时拿不到 Secrets，这里只做无需签名的检查
      # 提交号取 PR 头部提交，而非 GitHub 生成的临时合并提交
      - name: Lint、单元测试与 Debug 构建
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          ./gradlew --no-daemon --no-configuration-cache --continue
          "-Peta.buildMetadata=${HEAD_SHA::7}"
          :app:lintDebug :app:testDebugUnitTest :app:assembleDebug

      - name: 上传检查报告
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-check-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
